<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tactical Map</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="tactical/tactical-styles.css">
</head>
<body>
  <main class="tactical-shell">
    <div class="tactical-toolbar">
      <div>
        <h1>Tactical Map</h1>
        <div class="tactical-status" data-tactical-status>Loading map…</div>
      </div>
      <button type="button" data-tactical-reset>Reset view</button>
    </div>
    <div class="tactical-viewport">
      <canvas class="tactical-canvas" data-tactical-canvas aria-label="Tactical map"></canvas>
    </div>
  </main>
  <script src="tactical/tactical-state.js"></script>
  <script src="tactical/tactical-client.js"></script>
  <script src="tactical/tactical-render.js"></script>
  <script src="tactical/tactical-controls.js"></script>
  <script src="tactical/tactical.js"></script>
</body>
</html>
